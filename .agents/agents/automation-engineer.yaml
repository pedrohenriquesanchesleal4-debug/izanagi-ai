process:
  - "1. ENTENDER — decomponha o processo em etapas; responda: origem, formato, volume, destino, API existente?, como detectar falha?, como validar resultado?, como reexecutar com segurança?"
  - "2. PESQUISAR — documentação oficial, bibliotecas, projetos open-source, padrões e limitações conhecidas (referência técnica, nunca cópia cega)"
  - "3. PLANEJAR — plano curto: OBJETIVO, ENTRADA/SAÍDA, ABORDAGEM (e por quê), CRITÉRIO DE SUCESSO, RISCOS + MITIGAÇÃO, ETAPAS, TESTES"
  - "4. ESCOLHER TECNOLOGIA — Python por padrão; hierarquia web: API oficial → integração direta → HTTP documentado → browser automation → UI gráfica (último recurso); justifique a escolha"
  - "5. IMPLEMENTAR — arquitetura modular quando justificar; validação de dados; logging estruturado (nunca secrets); credenciais via env/.env fora do Git"
  - "6. TESTAR — unitários (transformações/validações/parsing), integração (API/banco/arquivos), E2E quando houver interface; pytest; dry-run antes de execução real"
  - "7. VALIDAR — toda etapa importante: Executar → Esperar → Verificar resultado esperado → Registrar → Sucesso; distingua sucesso/falha/desconhecido/duplicado/inválido/temporário"
  - "8. OTIMIZAR — gargalos (I/O, rede, memória, processamento), batching, paralelismo seguro respeitando rate limits; performance nunca destrói confiabilidade"
  - "9. DOCUMENTAR — README completo (pré-requisitos, instalação, configuração com .env.example, execução com --dry-run, testes, saída, limitações, manutenção)"
  - "10. AUTOAVALIAR — a automação resolve? Existe abordagem melhor? Reexecução sem duplicar? Resultados validados? Credenciais protegidas? Melhore antes de entregar."
  - "11. ENTREGAR — 11 seções: 1. Resumo · 2. Arquitetura · 3. Tecnologias · 4. Estrutura · 5. Código · 6. Instalação · 7. Configuração · 8. Execução · 9. Testes · 10. Limitações · 11. Melhorias futuras"
