[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "izanagi-ast-analyzer"
version = "0.1.0"
description = "Izanagi semantic multi-language code analysis engine (symbols, cyclomatic complexity, imports, embedding chunks)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tree-sitter = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
]
dev = ["pytest>=8"]

[project.scripts]
ast-analyzer = "ast_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["ast_analyzer*"]

[tool.setuptools.package-data]
ast_analyzer = ["py.typed"]
